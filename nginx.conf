events {
    worker_connections 1024;
}

http {
    # Lets nginx switch a request to a WebSocket when the client asks for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        least_conn;              # send to whichever instance has fewer active requests
        server api:3000;         # Docker's internal DNS resolves "api" to all replicas' IPs
    }

    server {
        listen 80;

        # WebSocket traffic (Socket.IO)
        location /socket.io/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;   # keep idle sockets open
            proxy_send_timeout 3600s;
        }

        # Everything else (REST API, docs)
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}