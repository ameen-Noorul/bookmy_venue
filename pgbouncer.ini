[databases]
; This line means: "when someone connects asking for a database named
; 'bookmyvenue', actually forward them to the real Postgres running on
; the Windows host, on its normal port 5432."
bookmyvenue = host=host.docker.internal port=5432 dbname=bookmyvenue

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Where PgBouncer looks up allowed users/passwords
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; This is the important setting from the explanation above —
; transaction mode gives up the real connection right after each
; transaction finishes, instead of holding it for the whole session.
pool_mode = transaction

; Max real connections PgBouncer will open to actual Postgres.
; Keep this comfortably under Postgres's own limit (default 100).
default_pool_size = 20
max_client_conn = 200

; Basic logging so you can see what it's doing
admin_users = postgres